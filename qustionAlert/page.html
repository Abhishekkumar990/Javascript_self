<body>
    <script>
        "use strict";

        function ask(question, yes, no) {
            if (confirm(question)) yes();
            else no();

        }
        ask(
            'Do You Agree?',
            function() {
                alert('tyoe agree')
            },
            function() {
                alert('you disagree')
            }
        );
    </script>
