<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled Front Page</title>
    <link rel="stylesheet" href="/helloworld/index.css" />
</head>

<body>
    <div class="container">
        <div class="header">
            <input class="result_display" id="display_result" type="text" placeholder="Your result..." />

        </div>

        <div class="number-content">
            <div class="button_box"><button id="add">Add</button></div>
            <div class="button_box"><button id="sub">Sub</button></div>
            <div class="button_box"><button id="mul">Mul</button></div>
            <div class="button_box"><button id="div">Div</button></div>
            <div class="button_box"><button id="1">1</button></div>
            <div class="button_box"><button id="2">2</button></div>
            <div class="button_box"><button id="3">3</button></div>
            <div class="button_box"><button id="4">4</button></div>
            <div class="button_box"><button id="5">5</button></div>
            <div class="button_box"><button id="6">6</button></div>
            <div class="button_box"><button id="7">7</button></div>
            <div class="button_box"><button id="8">8</button></div>
            <div class="button_box"><button id="9">9</button></div>
            <div class="button_box"><button id="0">0</button></div>

            <div class="button_box"><button id="clear">Clear</button></div>
            <div class="button_box">
                <button id="eql-btn">=</button></div>
        </div>
    </div>

    <script src="/helloworld/index.js "></script>
</body>

</html>
